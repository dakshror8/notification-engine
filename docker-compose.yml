services:
  postgres:
    image: postgres:16-alpine
    container_name: notification_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required in .env}
      POSTGRES_DB: ${POSTGRES_DB:-notification_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: notification_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
